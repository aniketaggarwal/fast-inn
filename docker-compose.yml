services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotelverify
      POSTGRES_PASSWORD: hotelverify
      POSTGRES_DB: hotelverify_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-issuer-db.sql:/docker-entrypoint-initdb.d/01-init-issuer-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelverify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hotelverify
      MINIO_ROOT_PASSWORD: hotelverify_dev_only
      # The guest browser PUTs KYC documents directly to MinIO using a
      # presigned URL (Section 9.6) — that request needs a real CORS grant
      # from MinIO itself, not just from the issuer/api services.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  issuer:
    build:
      context: .
      dockerfile: issuer/Dockerfile
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://hotelverify:hotelverify@postgres:5432/hotelverify_issuer
      # S3_ENDPOINT is what the issuer container itself uses (internal
      # docker network name). S3_PUBLIC_ENDPOINT is what gets baked into
      # presigned URLs, since those are followed by the guest's browser on
      # the host, which can't resolve the "minio" hostname.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: hotelverify
      S3_SECRET_KEY: hotelverify_dev_only
      S3_BUCKET: hotelverify-kyc
      S3_REGION: us-east-1
      ISSUER_SERVICE_TOKEN: dev_issuer_service_token_change_me
    ports:
      - "4001:4001"
    volumes:
      - ./issuer/keys:/app/issuer/keys
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://hotelverify:hotelverify@postgres:5432/hotelverify_app
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      ISSUER_BASE_URL: http://issuer:4001
      ISSUER_SERVICE_TOKEN: dev_issuer_service_token_change_me
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      issuer:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      VITE_API_BASE: http://localhost:4000
      VITE_ISSUER_BASE: http://localhost:4001
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
