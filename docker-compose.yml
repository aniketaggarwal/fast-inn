services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotelverify
      POSTGRES_PASSWORD: hotelverify
      POSTGRES_DB: hotelverify_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-issuer-db.sql:/docker-entrypoint-initdb.d/01-init-issuer-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelverify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hotelverify
      MINIO_ROOT_PASSWORD: hotelverify_dev_only
      # The guest browser PUTs KYC documents directly to MinIO using a
      # presigned URL (Section 9.6) — that request needs a real CORS grant
      # from MinIO itself, not just from the issuer/api services.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The whole product in one container (root Dockerfile, run by
  # scripts/serve.js): web + api + issuer, with its own Redis and MinIO. It
  # only needs Postgres from this file. Opt-in so `docker compose up -d
  # postgres redis minio` (local development) is unchanged:
  #   docker compose --profile app up --build      -> http://localhost:8080
  app:
    profiles: ["app"]
    build:
      context: .
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://hotelverify:hotelverify@postgres:5432/hotelverify_app
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      ISSUER_SERVICE_TOKEN: dev_issuer_service_token_change_me
      DEMO_MODE: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
