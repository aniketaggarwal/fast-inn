name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotelverify
          POSTGRES_PASSWORD: hotelverify
          POSTGRES_DB: hotelverify_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotelverify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hotelverify:hotelverify@localhost:5432/hotelverify_app
      ISSUER_DATABASE_URL: postgresql://hotelverify:hotelverify@localhost:5432/hotelverify_issuer
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create issuer database
        run: psql "postgresql://hotelverify:hotelverify@localhost:5432/postgres" -c "CREATE DATABASE hotelverify_issuer"
        env:
          PGPASSWORD: hotelverify

      - name: Run api migrations
        run: npm run migrate:api

      - name: Run issuer migrations
        run: npm run migrate:issuer
        env:
          DATABASE_URL: ${{ env.ISSUER_DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Test — credentials (100% coverage enforced)
        run: npm run test:credentials:coverage

      - name: Test — api
        run: npm run test:api

      - name: Test — issuer
        run: npm run test:issuer
        env:
          DATABASE_URL: ${{ env.ISSUER_DATABASE_URL }}

      - name: Build web
        run: npm run build --workspace=web
