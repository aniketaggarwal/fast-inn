name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotelverify
          POSTGRES_PASSWORD: hotelverify
          POSTGRES_DB: hotelverify_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotelverify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hotelverify:hotelverify@localhost:5432/hotelverify_app
      ISSUER_DATABASE_URL: postgresql://hotelverify:hotelverify@localhost:5432/hotelverify_issuer
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: hotelverify
      S3_SECRET_KEY: hotelverify_dev_only
      S3_BUCKET: hotelverify-kyc
      S3_REGION: us-east-1
      ISSUER_SERVICE_TOKEN: ci_issuer_service_token
      WEB_BASE_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `canvas` (Milestone 6's face-match pipeline) ships prebuilt
      # binaries for most platforms, but falls back to a from-source build
      # needing these system libs if none matches this runner exactly.
      - name: Install canvas native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      # GitHub Actions' `services:` block has no way to override a
      # container's command, and minio/minio needs `server /data` passed
      # explicitly — so it's started as a plain background container
      # instead of a declarative service.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=hotelverify \
            -e MINIO_ROOT_PASSWORD=hotelverify_dev_only \
            minio/minio server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Create issuer database
        run: psql "postgresql://hotelverify:hotelverify@localhost:5432/postgres" -c "CREATE DATABASE hotelverify_issuer"
        env:
          PGPASSWORD: hotelverify

      - name: Run api migrations
        run: npm run migrate:api

      - name: Run issuer migrations
        run: npm run migrate:issuer
        env:
          DATABASE_URL: ${{ env.ISSUER_DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Test — credentials (100% coverage enforced)
        run: npm run test:credentials:coverage

      - name: Test — api
        run: npm run test:api

      - name: Test — issuer
        run: npm run test:issuer
        env:
          DATABASE_URL: ${{ env.ISSUER_DATABASE_URL }}

      - name: Build web
        run: npm run build --workspace=web
